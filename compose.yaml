name: db-explorer
services:
  app:
    build: .
    image: db-explorer:local
    init: true
    restart: unless-stopped
    ports:
      - '${DB_EXPLORER_BIND_ADDRESS:-127.0.0.1}:${DB_EXPLORER_PORT:-4317}:4317'
    environment:
      DB_EXPLORER_TOKEN: ${DB_EXPLORER_TOKEN:?Run npm run setup first}
      DB_EXPLORER_MASTER_KEY: ${DB_EXPLORER_MASTER_KEY:?Run npm run setup first}
    volumes:
      - workspace:/app/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  workspace:
